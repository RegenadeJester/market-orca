# =============================================================================
# Cloudflare Tunnel — Ingress Configuration
# Replace YOUR_TUNNEL_ID and hostnames with your own values.
# See: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
# =============================================================================

tunnel: YOUR_TUNNEL_ID
credentials-file: /etc/cloudflared/YOUR_TUNNEL_ID.json

ingress:
  - hostname: market-orca.example.com
    service: http://localhost:4567
  - hostname: report.example.com
    service: http://localhost:4568
  - hostname: mcp.example.com
    service: http://localhost:1788
  - hostname: searxng.example.com
    service: http://localhost:18080
  - hostname: n8n.example.com
    service: http://localhost:5678
  - hostname: docs.example.com
    service: http://localhost:4173
  - service: http_status:404
